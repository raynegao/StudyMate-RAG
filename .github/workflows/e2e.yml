name: Real-stack E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      STUDYMATE_LLM_MODEL: deepseek-v4-flash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install E2E runner dependency
        run: python -m pip install "requests==2.32.3"

      - name: Require DeepSeek repository secret
        run: test -n "$DEEPSEEK_API_KEY"

      - name: Run isolated Docker E2E
        run: python scripts/run_docker_e2e.py --output /tmp/docker-e2e-result.json

      - name: Upload machine-readable evidence
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e-result
          path: /tmp/docker-e2e-result.json
